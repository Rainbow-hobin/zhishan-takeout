<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智膳 · 网页版</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-shell">
    <div id="app"></div>
    <div id="global-tabbar" class="tabbar global-tabbar hidden"></div>
  </div>
  <div id="toast" class="toast"></div>
  <div id="confirm-mask" class="confirm-mask hidden">
    <div class="confirm-box">
      <p id="confirm-text"></p>
      <div class="confirm-btns">
        <button class="btn-plain" id="confirm-cancel">取消</button>
        <button class="btn-primary" id="confirm-ok">确定</button>
      </div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/util.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
