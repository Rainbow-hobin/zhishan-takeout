
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on
	gzip on;
	gzip_min_length 1k;
	gzip_comp_level 5;
	gzip_vary on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;

	map $http_upgrade $connection_upgrade{
		default upgrade;
		'' close;
	}

	upstream webservers{
	  server 127.0.0.1:8080 weight=90 ;
	  #server 127.0.0.1:8088 weight=10 ;
	}

    server {
        listen       80;
        listen       [::]:80;
        server_name  localhost;

        #charset koi8-r;

        #access_log  logs/host.access.log  main;

        # 网页版（智膳）
        # 入口 HTML 不缓存，保证发版后用户立即拿到新的资源引用
        location = / {
            root   html/web-app;
            index  index.html index.htm;
            add_header Cache-Control "no-cache";
        }

        location ~* \.html$ {
            root   html/web-app;
            add_header Cache-Control "no-cache";
        }

        # css/js 文件名无 hash 指纹，用短缓存 + ETag 协商，兼顾发版及时更新
        location ~* \.(css|js)$ {
            root   html/web-app;
            add_header Cache-Control "public, max-age=300";
        }

        # 图片/字体等基本不变的静态资源，浏览器缓存 7 天
        location ~* \.(png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
            root   html/web-app;
            expires 7d;
            add_header Cache-Control "public";
        }

        location / {
            root   html/web-app;
            index  index.html index.htm;
        }

        # 原版 PC 商家管理后台（Vue 编译产物，接口走 /api/ → :8080/admin/）
        location = /admin {
            return 301 /admin/;
        }
        location ^~ /admin/ {
            alias  html/sky/;
            index  index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        # 商家客服独立网页（聊天工作台）
        location = /kefu {
            return 301 /kefu/;
        }
        location ^~ /kefu/ {
            alias  html/kefu/;
            index  index.html;
            try_files $uri $uri/ /kefu/index.html;
        }

        #error_page 404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        # ????,??????????
        location /api/ {
			proxy_pass   http://localhost:8080/admin/;
            #proxy_pass   http://webservers/admin/;
        }
		
		# ????,??????????
        location /user/ {
            proxy_pass   http://webservers/user/;
        }

        # WebSocket
		location /ws/ {
            proxy_pass   http://webservers/ws/;
			proxy_http_version 1.1;
			proxy_read_timeout 3600s;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "$connection_upgrade";
        }

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}

        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }


    # another virtual host using mix of IP-, name-, and port-based configuration
    #
